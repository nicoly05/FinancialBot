{% extends "base.html" %}

{% block title %}Recuperar Palavra-passe - FinancialBot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-key" style="font-size: 3rem; color: var(--primary-color);"></i>
                <h2 class="mt-3">Recuperar Palavra-passe</h2>
                <p class="text-muted">Redefine a tua palavra-passe</p>
            </div>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Nome de utilizador</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                
                <div class="mb-3">
                    <label for="security_answer" class="form-label">Resposta à pergunta de segurança</label>
                    <input type="text" class="form-control" id="security_answer" name="security_answer" required>
                </div>
                
                <div class="mb-3">
                    <label for="new_password" class="form-label">Nova palavra-passe</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3">Redefinir Palavra-passe</button>
            </form>
            
            <div class="text-center">
                <p><a href="{{ url_for('login') }}">Voltar ao login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
