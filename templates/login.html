{% extends "base.html" %}

{% block title %}Login - FinancialBot{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-wallet2" style="font-size: 3rem; color: var(--primary-color);"></i>
                <h2 class="mt-3">FinancialBot</h2>
                <p class="text-muted">Gerencia as tuas finanças de forma inteligente</p>
            </div>
            
            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Nome de utilizador</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Palavra-passe</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
            </form>
            
            <div class="text-center">
                <p class="mb-2">Não tens conta? <a href="{{ url_for('register') }}">Regista-te</a></p>
                <p><a href="{{ url_for('recover') }}">Esqueceste a tua palavra-passe?</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
